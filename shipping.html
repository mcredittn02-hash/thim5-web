<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Điều Phối Shipper • Thím 5 Hòa Thành</title>
  
  <!-- PWA Metadata & Favicon -->
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛵</text></svg>">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['monospace']
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-3 sm:p-4 text-xs select-none">

  <div class="max-w-md mx-auto space-y-3">

    <!-- ========================================================================= -->
    <!-- 1. MÀN HÌNH ĐĂNG NHẬP 4 SỐ CUỐI SĐT (PIN AUTH SCREEN)                    -->
    <!-- ========================================================================= -->
    <div id="authScreen" class="bg-slate-900 border-2 border-amber-500/50 rounded-3xl p-6 text-center space-y-4 shadow-2xl mt-12 animate-in fade-in zoom-in-95 duration-200">
      <div class="w-16 h-16 rounded-3xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-3xl mx-auto shadow-inner">
        <i class="fa-solid fa-motorcycle"></i>
      </div>
      
      <div class="space-y-1">
        <h2 class="text-base font-black text-white uppercase tracking-wider">Trạm Điều Phối Shipper</h2>
        <p class="text-[11px] text-slate-400">Nhập 4 số cuối số điện thoại để vào ca nhận cuốc xe:</p>
      </div>

      <div class="pt-2">
        <input type="tel" 
               id="shipperPinInput" 
               maxlength="4" 
               placeholder="0585" 
               class="w-48 mx-auto bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl py-2.5 text-center text-2xl font-mono font-black text-amber-400 tracking-[0.3em] outline-none transition shadow-inner" 
               autofocus />
      </div>

      <button type="button" 
              onclick="ShipperPortalController.handleShipperLogin()" 
              class="w-full max-w-[200px] mx-auto py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:opacity-95 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition active:scale-95 flex items-center justify-center gap-2">
        <span>Vào Nhận Đơn</span>
        <i class="fa-solid fa-arrow-right text-[10px]"></i>
      </button>

      <p id="loginError" class="hidden text-rose-400 text-[11px] font-bold"></p>
    </div>

    <!-- ========================================================================= -->
    <!-- 2. MÀN HÌNH ĐIỀU PHỐI CHÍNH (MAIN DISPATCH SCREEN)                        -->
    <!-- ========================================================================= -->
    <div id="mainScreen" class="hidden space-y-3">
      
      <!-- TOPBAR THÔNG TIN BÁC TÀI -->
      <header class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-lg shrink-0">
            <i class="fa-solid fa-id-badge"></i>
          </div>
          <div class="min-w-0">
            <h2 id="dispShipperName" class="text-xs font-black text-amber-400 truncate">Tài Xế: Đang nạp...</h2>
            <p id="dispShipperPhone" class="text-[10px] text-slate-400 font-mono">SĐT: ...</p>
          </div>
        </div>
        <button type="button" 
                onclick="ShipperPortalController.handleLogout()" 
                class="px-2.5 py-1.5 rounded-xl bg-slate-950 hover:bg-rose-500/10 text-slate-400 hover:text-rose-400 border border-slate-800 text-[10.5px] font-bold transition active:scale-95">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Rời Ca
        </button>
      </header>

      <!-- KPI THU NHẬP HÔM NAY -->
      <div class="grid grid-cols-2 gap-2.5">
        <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm">
          <span class="text-[9.5px] font-bold uppercase tracking-wider text-slate-400 block">Đơn Hoàn Tất Hôm Nay</span>
          <strong id="dispCompletedCount" class="text-base font-mono font-black text-emerald-400 block mt-0.5">0 đơn</strong>
        </div>
        <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm">
          <span class="text-[9.5px] font-bold uppercase tracking-wider text-slate-400 block">Tiền Ship Thực Nhận</span>
          <strong id="dispTotalShipEarn" class="text-base font-mono font-black text-amber-400 block mt-0.5">0 đ</strong>
        </div>
      </div>

      <!-- THANH BỘ LỌC TABS CUỐC XE -->
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scroll pb-1">
        <button type="button" 
                data-filter="all" 
                onclick="ShipperPortalController.changeFilter('all', this)" 
                class="tab-filter-btn shrink-0 px-3 py-2 rounded-xl font-bold text-[11px] transition bg-amber-500 text-slate-950 active">
          🌐 Tất Cả
        </button>
        <button type="button" 
                data-filter="wait_verify" 
                onclick="ShipperPortalController.changeFilter('wait_verify', this)" 
                class="tab-filter-btn shrink-0 px-3 py-2 rounded-xl font-bold text-[11px] transition bg-slate-900 text-slate-400 border border-slate-800 hover:text-white">
          ⏳ Cần Gọi Xác Minh
        </button>
        <button type="button" 
                data-filter="delivering" 
                onclick="ShipperPortalController.changeFilter('delivering', this)" 
                class="tab-filter-btn shrink-0 px-3 py-2 rounded-xl font-bold text-[11px] transition bg-slate-900 text-slate-400 border border-slate-800 hover:text-white">
          🛵 Đang Giao
        </button>
        <button type="button" 
                data-filter="completed" 
                onclick="ShipperPortalController.changeFilter('completed', this)" 
                class="tab-filter-btn shrink-0 px-3 py-2 rounded-xl font-bold text-[11px] transition bg-slate-900 text-slate-400 border border-slate-800 hover:text-white">
          ✅ Đã Giao Xong
        </button>
      </div>

      <!-- NÚT LÀM MỚI TỨC THÌ -->
      <button type="button" 
              id="btnRefreshOrders" 
              onclick="ShipperPortalController.loadShipperOrders()" 
              class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 text-xs font-bold transition flex items-center justify-center gap-2 active:scale-95 shadow">
        <i id="iconRefreshSpin" class="fa-solid fa-rotate"></i>
        <span>Làm Mới Danh Sách Cuốc Xe</span>
      </button>

      <!-- KHUNG HIỂN THỊ DANH SÁCH CUỐC XE -->
      <div id="ordersContainer" class="space-y-3 pt-1">
        <div class="p-8 rounded-3xl bg-slate-900/60 border border-slate-800 text-center text-slate-400 space-y-2">
          <i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-xl"></i>
          <p class="text-xs font-medium">Đang đồng bộ danh sách đơn từ Bếp Thím 5...</p>
        </div>
      </div>

    </div>

  </div>
  <script src="api.js"></script>
  <script>
  /**
   * =========================================================================
   * CONTROLLER: SHIPPER DISPATCH PORTAL (TRẠM ĐIỀU PHỐI TÀI XẾ THÍM 5 v2.9)
   * Tác giả: Đu Đủ - Cố vấn Chiến lược & Kỹ sư Trưởng hệ thống
   * Kiến trúc: Headless GAS API, Adaptive Polling, Optimistic UI State Machine
   * =========================================================================
   */
  var ShipperPortalController = (function() {
      var currentLast4 = "";
      var autoRefreshTimer = null;
      var cachedOrdersList = [];
      var currentActiveFilter = "all";
      var isCallingApi = false;

      var SHIPPER_PRESETS = {
          "0585": { name: "Nguyễn Hải Âu", phone: "0934.220.585" },
          "4693": { name: "Nguyễn Hải Âu", phone: "0969.004.693" },
          "2862": { name: "Trần Minh Nam", phone: "0968.222.862" }
      };

      function isRunningInsideGAS() {
          return typeof google !== 'undefined' && google.script && typeof google.script.run !== 'undefined';
      }

      function callBackend(gasFunctionName, gasArgsArray, apiActionName, apiPayloadObj) {
          return new Promise(function(resolve, reject) {
              if (isRunningInsideGAS()) {
                  var runner = google.script.run
                      .withSuccessHandler(function(res) { resolve(res); })
                      .withFailureHandler(function(err) { reject(err); });
                  if (typeof runner[gasFunctionName] === 'function') {
                      runner[gasFunctionName].apply(runner, gasArgsArray || []);
                  } else {
                      reject(new Error("Hàm " + gasFunctionName + " không tồn tại trong GAS"));
                  }
              } else if (window.Thim5API && typeof window.Thim5API.callGAS === 'function') {
                  window.Thim5API.callGAS(apiActionName, apiPayloadObj || {})
                      .then(function(res) { 
                          if (res && res.data !== undefined) resolve(res.data);
                          else resolve(res);
                      })
                      .catch(function(err) { reject(err); });
              } else {
                  setTimeout(function() {
                      resolve(getMockDispatchData(apiActionName, apiPayloadObj));
                  }, 300);
              }
          });
      }

      function init() {
          var savedLast4 = localStorage.getItem("thim5_shipper_last4");
          if (savedLast4 && savedLast4.length === 4) {
              var pinInput = document.getElementById("shipperPinInput");
              if (pinInput) pinInput.value = savedLast4;
              handleShipperLogin();
          }
      }

      function handleShipperLogin() {
          var pinInput = document.getElementById("shipperPinInput");
          var pin = pinInput ? pinInput.value.trim().replace(/\D/g, '') : '';
          var errBox = document.getElementById("loginError");

          if (errBox) errBox.classList.add("hidden");

          if (pin.length < 4) {
              if (errBox) {
                  errBox.innerText = "Vui lòng nhập đủ 4 số cuối số điện thoại!";
                  errBox.classList.remove("hidden");
              }
              return;
          }

          currentLast4 = pin;
          localStorage.setItem("thim5_shipper_last4", currentLast4);

          var shipperData = SHIPPER_PRESETS[currentLast4] || {
              name: "Tài Xế (" + currentLast4 + ")",
              phone: "09xx.xxx." + currentLast4
          };

          var authScreen = document.getElementById("authScreen");
          var mainScreen = document.getElementById("mainScreen");
          var dispName = document.getElementById("dispShipperName");
          var dispPhone = document.getElementById("dispShipperPhone");

          if (authScreen) authScreen.classList.add("hidden");
          if (mainScreen) mainScreen.classList.remove("hidden");
          if (dispName) dispName.innerText = "Tài Xế: " + shipperData.name;
          if (dispPhone) dispPhone.innerText = "SĐT: " + shipperData.phone;

          loadShipperOrders();
          startAdaptivePolling();
      }

      function startAdaptivePolling() {
          if (autoRefreshTimer) clearInterval(autoRefreshTimer);
          autoRefreshTimer = setInterval(function() {
              loadShipperOrders(true);
          }, 15000);
      }

      async function loadShipperOrders(isSilent) {
          if (!currentLast4 || isCallingApi) return;
          isCallingApi = true;

          var spinIcon = document.getElementById("iconRefreshSpin");
          if (!isSilent && spinIcon) spinIcon.classList.add("fa-spin");

          try {
              var res = await callBackend(
                  "getShipperOrders", 
                  [currentLast4], 
                  "getShipperOrders", 
                  { last4: currentLast4 }
              );
              
              if (res && Array.isArray(res.orders)) {
                  cachedOrdersList = res.orders;
              } else if (res && res.data && Array.isArray(res.data.orders)) {
                  cachedOrdersList = res.data.orders;
              } else if (Array.isArray(res)) {
                  cachedOrdersList = res;
              }

              if (res && res.shipper) {
                  var dispName = document.getElementById("dispShipperName");
                  var dispPhone = document.getElementById("dispShipperPhone");
                  if (res.shipper.name && dispName) dispName.innerText = "Tài Xế: " + res.shipper.name;
                  if (res.shipper.phone && dispPhone) dispPhone.innerText = "SĐT: " + res.shipper.phone;
              }

              renderOrders();
          } catch (err) {
              console.error("❌ Lỗi nạp cuốc xe Shipper:", err);
          } finally {
              if (spinIcon) spinIcon.classList.remove("fa-spin");
              isCallingApi = false;
          }
      }

      function changeFilter(filterKey, btnElement) {
          currentActiveFilter = filterKey;
          document.querySelectorAll(".tab-filter-btn").forEach(function(b) {
              b.className = "tab-filter-btn shrink-0 px-3 py-2 rounded-xl font-bold text-[11px] transition bg-slate-900 text-slate-400 border border-slate-800 hover:text-white";
          });
          if (btnElement) {
              btnElement.className = "tab-filter-btn shrink-0 px-3 py-2 rounded-xl font-bold text-[11px] transition bg-amber-500 text-slate-950 active";
          }
          renderOrders();
      }

      function renderOrders() {
          var container = document.getElementById("ordersContainer");
          if (!container) return;

          var completedOrders = cachedOrdersList.filter(function(o) { 
              return Number(o.step) === 4 || o.status === "Hoàn Tất" || o.status === "COMPLETED"; 
          });
          var totalShipEarn = completedOrders.reduce(function(sum, o) { 
              return sum + (Number(o.shipFee) || 12000); 
          }, 0);

          var dispCount = document.getElementById("dispCompletedCount");
          var dispEarn = document.getElementById("dispTotalShipEarn");
          if (dispCount) dispCount.innerText = completedOrders.length + " đơn";
          if (dispEarn) dispEarn.innerText = totalShipEarn.toLocaleString('vi-VN') + " đ";

          var displayList = cachedOrdersList;
          if (currentActiveFilter === 'wait_verify') {
              displayList = cachedOrdersList.filter(function(o) { return Number(o.step) === 0; });
          } else if (currentActiveFilter === 'delivering') {
              displayList = cachedOrdersList.filter(function(o) { return Number(o.step) === 3; });
          } else if (currentActiveFilter === 'completed') {
              displayList = cachedOrdersList.filter(function(o) { return Number(o.step) === 4 || o.status === "Hoàn Tất" || o.status === "COMPLETED"; });
          } else {
              displayList = cachedOrdersList.filter(function(o) { return Number(o.step) < 4 && o.status !== "Hoàn Tất" && o.status !== "COMPLETED"; });
          }

          if (displayList.length === 0) {
              container.innerHTML = `
                  <div class="p-8 rounded-3xl bg-slate-900 border border-slate-800 text-center text-slate-400 space-y-2">
                      <i class="fa-solid fa-clipboard-check text-2xl text-slate-600"></i>
                      <p class="font-bold text-xs text-slate-300">Không có cuốc xe nào trong mục này.</p>
                      <p class="text-[10px] text-slate-500">Hệ thống tự động lắng nghe đơn mới mỗi 15 giây...</p>
                  </div>
              `;
              return;
          }

          var html = "";
          displayList.forEach(function(o) {
              var cleanCode = String(o.code || "").trim();
              var stepNum = Number(o.step);
              var isStep0 = (stepNum === 0);
              var isDelivering = (stepNum === 3);
              var isCompleted = (stepNum === 4 || o.status === "Hoàn Tất" || o.status === "COMPLETED");
              var isOnlinePaid = (o.method === "CK_VIETQR" || o.method === "VIETQR" || o.method === "BANK" || o.method === "MOMO");

              var storeNavUrl = o.storeGpsUrl || "https://www.google.com/maps/dir/?api=1&destination=11.285267,106.133347";
              var custNavUrl = o.customerGpsUrl || ("https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent((o.address || "Hòa Thành, Tây Ninh")));

              var formattedItemsHtml = (o.items || '').split(" | ").map(function(itemText) {
                  return `<div class="text-[11px] text-slate-300">• ${itemText}</div>`;
              }).join("");

              var shipFeeEarn = Number(o.shipFee) || 12000;
              var isFreeship = (Number(o.finalShipFee) === 0 || Number(o.shippingSubsidy) >= shipFeeEarn);

              html += `
                  <div class="p-4 rounded-3xl bg-slate-900 border ${isStep0 ? 'border-amber-500/60 bg-amber-950/10' : (isDelivering ? 'border-sky-500/60' : (isCompleted ? 'border-emerald-500/60 opacity-90' : 'border-slate-800'))} shadow-xl space-y-3">
                      
                      <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
                          <div class="flex items-center gap-1.5">
                              <span class="font-mono font-black text-amber-400 text-sm">${cleanCode}</span>
                              <span class="text-[10px] font-mono text-slate-400 bg-slate-950 px-2 py-0.5 rounded-full border border-slate-800">~${o.dist || 1.2} km</span>
                          </div>
                          <span class="px-2.5 py-0.5 rounded-full text-[9.5px] font-bold uppercase tracking-wider ${isStep0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : (isDelivering ? 'bg-sky-500/20 text-sky-300 border border-sky-500/30' : (isCompleted ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-orange-500/20 text-orange-300 border border-orange-500/30'))}">
                              ${isStep0 ? '⏳ Chờ Xác Minh COD' : (isDelivering ? '🛵 Đang Giao' : (isCompleted ? '✅ Đã Hoàn Tất' : '🍳 Bếp Đang Nấu'))}
                          </span>
                      </div>

                      <div class="space-y-1 text-xs">
                          <div class="flex justify-between">
                              <span class="text-slate-400">Khách hàng:</span>
                              <strong class="text-white">${o.name}</strong>
                          </div>
                          <div class="flex justify-between items-start gap-2">
                              <span class="text-slate-400 shrink-0">Địa chỉ:</span>
                              <strong class="text-right text-slate-200 text-[11px] leading-tight">${o.address}</strong>
                          </div>
                      </div>

                      <div class="p-2.5 rounded-2xl bg-slate-950 border border-slate-800 space-y-1">
                          <div class="font-bold text-amber-400 text-[11px] flex items-center gap-1">
                              <i class="fa-solid fa-bowl-food text-[10px]"></i> Món & Topping:
                          </div>
                          ${formattedItemsHtml}
                          <div class="text-[10px] text-slate-400 pt-0.5 border-t border-slate-900 mt-1">
                              <strong class="text-slate-300">Khẩu vị:</strong> ${o.taste || 'Cay Nhẹ (Chuẩn vị Thím 5)'}
                          </div>
                      </div>

                      <div class="p-2.5 rounded-2xl bg-slate-950 border border-slate-800 space-y-1.5 text-xs">
                          <div class="flex justify-between items-center">
                              <span class="text-slate-400 text-[10.5px]">Thanh toán:</span>
                              <strong class="font-bold ${isOnlinePaid ? 'text-emerald-400' : 'text-amber-400'}">
                                  ${isOnlinePaid ? '💳 Đã Quét VietQR' : '💵 Tiền Mặt (COD)'}
                              </strong>
                          </div>
                          <div class="flex justify-between items-center">
                              <span class="text-slate-400 text-[10.5px]">Tiền Ship Thực Nhận:</span>
                              <strong class="font-mono ${isFreeship ? 'text-emerald-400' : 'text-amber-400'} font-black">
                                  ${shipFeeEarn.toLocaleString('vi-VN')} đ ${isFreeship ? '<span class="text-[9px] font-normal text-emerald-400">(Quán Trợ Giá 100%)</span>' : ''}
                              </strong>
                          </div>
                          
                          <div class="pt-1.5 border-t border-slate-900 flex justify-between items-center text-[11px]">
                              ${isOnlinePaid ? `
                                  <span class="text-emerald-400 font-bold flex items-center gap-1">
                                      <i class="fa-solid fa-circle-check text-[10px]"></i> Đã thanh toán online: <strong>Thu khách 0 đ</strong>
                                  </span>
                              ` : `
                                  <span class="text-slate-300">Thu Tiền Mặt Của Khách:</span>
                                  <strong class="font-mono font-black text-rose-400 text-sm">
                                      ${Number(o.collectFromCustomer || o.total).toLocaleString('vi-VN')} đ
                                  </strong>
                              `}
                          </div>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                          <a href="${storeNavUrl}" target="_blank" class="py-2 px-2.5 rounded-xl bg-orange-600/20 hover:bg-orange-600/30 text-orange-300 border border-orange-500/30 text-center font-bold text-[10.5px] transition flex items-center justify-center gap-1 active:scale-95">
                              <i class="fa-solid fa-store text-[10px]"></i>
                              <span>1. Đến Bếp Lấy</span>
                          </a>
                          <a href="${custNavUrl}" target="_blank" class="py-2 px-2.5 rounded-xl bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 border border-sky-500/30 text-center font-bold text-[10.5px] transition flex items-center justify-center gap-1 active:scale-95">
                              <i class="fa-solid fa-location-arrow text-[10px]"></i>
                              <span>2. Dẫn Đến Khách</span>
                          </a>
                      </div>

                      <a href="tel:${o.phone}" class="py-2 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white text-center font-bold text-[11px] block transition">
                          <i class="fa-solid fa-phone text-amber-400 mr-1"></i> Gọi Khách: ${o.phone}
                      </a>

                      ${isStep0 ? `
                          <button type="button" id="btn_verify_${cleanCode}" onclick="ShipperPortalController.verifyCodOrder('${cleanCode}')" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider transition shadow flex items-center justify-center gap-1.5 active:scale-95">
                              <i class="fa-solid fa-phone-volume"></i>
                              <span>Đã Gọi Xác Nhận ➔ Báo Bếp Nấu</span>
                          </button>
                      ` : (!isDelivering && !isCompleted ? `
                          <button type="button" id="btn_take_${cleanCode}" onclick="ShipperPortalController.takeOrder('${cleanCode}')" class="w-full py-2.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-black text-xs uppercase tracking-wider transition shadow-lg shadow-orange-600/20 flex items-center justify-center gap-1.5 active:scale-95">
                              <i class="fa-solid fa-motorcycle"></i>
                              <span>Nhận Cuốc Xe Giao Đơn Này</span>
                          </button>
                      ` : (isDelivering ? `
                          <div class="space-y-1.5">
                              <button type="button" id="btn_done_${cleanCode}" onclick="ShipperPortalController.completeOrder('${cleanCode}')" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-1.5 active:scale-95">
                                  <i class="fa-solid fa-circle-check"></i>
                                  <span>Đã Giao Xong & Thu Đủ Tiền</span>
                              </button>
                              <button type="button" onclick="ShipperPortalController.cancelOrder('${cleanCode}')" class="w-full py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold text-[11px] transition">
                                  ⚠️ Báo Hỏng Xe / Trả Đơn Về Bếp
                              </button>
                          </div>
                      ` : ''))}

                  </div>
              `;
          });

          container.innerHTML = html;
      }

      async function verifyCodOrder(orderCode) {
          var cleanCode = String(orderCode || "").trim();
          var dispName = document.getElementById("dispShipperName");
          var sName = dispName ? dispName.innerText.replace("Tài Xế: ", "") : "Tài Xế";
          var shipperLabel = sName + " (" + currentLast4 + ")";

          if (!confirm("Xác nhận bạn đã gọi điện cho khách và khách đồng ý nhận đơn " + cleanCode + "?")) return;

          var matched = cachedOrdersList.find(function(o) { return String(o.code || "").trim() === cleanCode; });
          if (matched) {
              matched.step = 2;
              matched.status = "COOKING";
              matched.assignedShipper = shipperLabel;
              renderOrders();
          }

          try {
              await callBackend(
                  "shipperVerifyCodOrderSuccess", 
                  [cleanCode, shipperLabel], 
                  "shipperVerifyCodOrderSuccess", 
                  { orderCode: cleanCode, shipperInfo: shipperLabel }
              );
              alert("✅ Đã xác minh COD thành công! Bếp KDS đã được mở để nấu.");
          } catch (err) {
              console.warn("⚠️ Đang chạy chế độ ngoại tuyến:", err.message);
          }
      }

      async function takeOrder(orderCode) {
          var cleanCode = String(orderCode || "").trim();
          var dispName = document.getElementById("dispShipperName");
          var sName = dispName ? dispName.innerText.replace("Tài Xế: ", "") : "Tài Xế";
          var shipperLabel = sName + " (" + currentLast4 + ")";

          var matched = cachedOrdersList.find(function(o) { return String(o.code || "").trim() === cleanCode; });
          if (matched) {
              matched.step = 3;
              matched.status = "DELIVERING";
              matched.assignedShipper = shipperLabel;
              renderOrders();
          }

          try {
              await callBackend(
                  "shipperUpdateStep", 
                  [cleanCode, shipperLabel, 3], 
                  "shipperUpdateStep", 
                  { orderCode: cleanCode, shipperName: shipperLabel, stepNumber: 3 }
              );
          } catch (err) {
              console.warn("⚠️ Cập nhật backend chậm, giữ trạng thái Optimistic UI:", err.message);
          }
      }

      async function completeOrder(orderCode) {
          var cleanCode = String(orderCode || "").trim();
          if (!confirm("Xác nhận đã giao đơn " + cleanCode + " tận tay khách và thu đủ tiền?")) return;

          var matched = cachedOrdersList.find(function(o) { return String(o.code || "").trim() === cleanCode; });
          if (matched) {
              matched.step = 4;
              matched.status = "COMPLETED";
              renderOrders();
          }

          try {
              await callBackend(
                  "shipperUpdateStep", 
                  [cleanCode, "", 4], 
                  "shipperUpdateStep", 
                  { orderCode: cleanCode, shipperName: "", stepNumber: 4 }
              );
              alert("🎉 Đã hoàn tất cuốc giao đơn " + cleanCode + "!");
          } catch (err) {
              console.warn("⚠️ Cập nhật hoàn tất ngoại tuyến:", err.message);
          }
      }

      async function cancelOrder(orderCode) {
          var cleanCode = String(orderCode || "").trim();
          var reason = prompt("Nhập lý do sự cố (VD: Hỏng xe, thủng lốp, khách không nghe máy...):", "Hỏng xe đột xuất");
          if (!reason || !reason.trim()) return;

          cachedOrdersList = cachedOrdersList.filter(function(o) { 
              return String(o.code || "").trim() !== cleanCode; 
          });
          renderOrders();

          try {
              await callBackend(
                  "shipperReleaseOrder", 
                  [cleanCode, reason], 
                  "shipperReleaseOrder", 
                  { orderCode: cleanCode, reason: reason }
              );
              alert("⚠️ Đã nhả đơn về Bếp để điều phối tài xế khác!");
          } catch (err) {
              console.warn("⚠️ Lỗi nhả đơn:", err.message);
          }
      }

      function handleLogout() {
          if (autoRefreshTimer) clearInterval(autoRefreshTimer);
          autoRefreshTimer = null;
          localStorage.removeItem("thim5_shipper_last4");
          currentLast4 = "";
          
          var mainScreen = document.getElementById("mainScreen");
          var authScreen = document.getElementById("authScreen");
          var pinInput = document.getElementById("shipperPinInput");

          if (mainScreen) mainScreen.classList.add("hidden");
          if (authScreen) authScreen.classList.remove("hidden");
          if (pinInput) pinInput.value = "";
      }

      function getMockDispatchData(action, payload) {
          return {
              shipper: SHIPPER_PRESETS[currentLast4] || { name: "Nguyễn Hải Âu", phone: "0934.220.585" },
              orders: cachedOrdersList.length > 0 ? cachedOrdersList : []
          };
      }

      return {
          init: init,
          handleShipperLogin: handleShipperLogin,
          loadShipperOrders: loadShipperOrders,
          changeFilter: changeFilter,
          verifyCodOrder: verifyCodOrder,
          takeOrder: takeOrder,
          completeOrder: completeOrder,
          cancelOrder: cancelOrder,
          handleLogout: handleLogout
      };
  })();

  document.addEventListener("DOMContentLoaded", function() {
      ShipperPortalController.init();
  });
  </script>
</body>
</html>
