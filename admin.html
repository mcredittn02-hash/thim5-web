<!DOCTYPE html>
<html lang="vi" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản Trị Thím 5 • Cổng Xác Thực Quyền Hạn</title>
  
  <!-- CDN Tailwind CSS v3 & FontAwesome Pro Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Adapter API kết nối Backend Google Apps Script -->
  <script src="api.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#131c2e',
              900: '#0f172a',
              950: '#020617'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-950 font-sans select-none">

  <!-- KHUNG CARD ĐĂNG NHẬP TRUNG TÂM -->
  <div id="login-card" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-7 shadow-2xl space-y-5 text-center transition-all duration-200">
    
    <!-- Header: Icon & Tiêu Đề Nhận Diện Thương Hiệu -->
    <div class="space-y-1.5">
      <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-xl mx-auto shadow-inner shadow-amber-500/20">
        <i class="fa-solid fa-crown"></i>
      </div>
      <h1 class="text-base font-black tracking-wider uppercase text-white">QUẢN TRỊ THÍM 5</h1>
      <p id="sub-title" class="text-xs text-slate-400">Nhập mã PIN quyền hạn để tiếp tục:</p>
    </div>

    <!-- Thanh Chuyển Đổi Tab: PIN Nhanh vs Super Admin 2FA -->
    <div class="flex items-center p-1 rounded-2xl bg-slate-950 border border-slate-800 text-xs font-bold">
      <button type="button" 
              id="tab-btn-pin" 
              onclick="AdminLoginController.switchMode('PIN')" 
              class="flex-1 py-1.5 rounded-xl transition bg-amber-500 text-slate-950 shadow">
        <i class="fa-solid fa-key text-[10px] mr-1"></i> Mã PIN POS
      </button>
      <button type="button" 
              id="tab-btn-super" 
              onclick="AdminLoginController.switchMode('SUPER')" 
              class="flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white">
        <i class="fa-solid fa-shield-halved text-[10px] mr-1"></i> Super 2FA
      </button>
    </div>

    <!-- ===================================================================== -->
    <!-- PHÂN HỆ 1: BÀN PHÍM NUMPAD MÃ PIN NHANH (MẶC ĐỊNH CHO THU NGÂN / BẾP)   -->
    <!-- ===================================================================== -->
    <div id="mode-pin-container" class="space-y-4">
      
      <!-- Vùng Hiển Thị Chấm PIN Trực Quan -->
      <div id="pin-dots-wrapper" class="flex items-center justify-center gap-3 py-1">
        <span id="pin-dot-0" class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></span>
        <span id="pin-dot-1" class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></span>
        <span id="pin-dot-2" class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></span>
        <span id="pin-dot-3" class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150"></span>
      </div>

      <!-- Bàn Phím Số Cảm Ứng Numpad -->
      <div class="grid grid-cols-3 gap-2 font-mono font-bold text-base max-w-[240px] mx-auto">
        <button type="button" onclick="AdminLoginController.pressDigit('1')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">1</button>
        <button type="button" onclick="AdminLoginController.pressDigit('2')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">2</button>
        <button type="button" onclick="AdminLoginController.pressDigit('3')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">3</button>
        <button type="button" onclick="AdminLoginController.pressDigit('4')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">4</button>
        <button type="button" onclick="AdminLoginController.pressDigit('5')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">5</button>
        <button type="button" onclick="AdminLoginController.pressDigit('6')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">6</button>
        <button type="button" onclick="AdminLoginController.pressDigit('7')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">7</button>
        <button type="button" onclick="AdminLoginController.pressDigit('8')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">8</button>
        <button type="button" onclick="AdminLoginController.pressDigit('9')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">9</button>
        <button type="button" onclick="AdminLoginController.clearAll()" class="h-11 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 active:scale-95 transition text-xs font-sans font-bold">Xóa</button>
        <button type="button" onclick="AdminLoginController.pressDigit('0')" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 active:scale-95 transition">0</button>
        <button type="button" onclick="AdminLoginController.backspace()" class="h-11 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-400 active:scale-95 transition text-sm"><i class="fa-solid fa-delete-left"></i></button>
      </div>

    </div>

    <!-- ===================================================================== -->
    <!-- PHÂN HỆ 2: CHẾ ĐỘ SUPER ADMIN 2FA (GOOGLE AUTHENTICATOR TOTP)          -->
    <!-- ===================================================================== -->
    <div id="mode-super-container" class="hidden space-y-3 text-left">
      <div class="space-y-1">
        <label class="text-[11px] font-bold text-slate-300">Khóa Master Super Key:</label>
        <input type="password" 
               id="input-master-key" 
               placeholder="Nhập Master Key..." 
               class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl px-3 py-2 text-xs font-mono text-white outline-none transition" />
      </div>

      <div class="space-y-1">
        <label class="text-[11px] font-bold text-slate-300">Mã 6 Số Google Authenticator (TOTP):</label>
        <input type="text" 
               id="input-totp-code" 
               maxlength="6" 
               placeholder="000000" 
               class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl px-3 py-2 text-center text-sm font-mono tracking-widest text-amber-400 font-bold outline-none transition" />
      </div>

      <div class="text-right">
        <button type="button" 
                onclick="AdminLoginController.requestEmergencyOtp()" 
                class="text-[10px] text-amber-400 hover:underline">
          Nhận mã khẩn cấp qua haiau2205@gmail.com
        </button>
      </div>
    </div>

    <!-- NÚT BẤM XÁC THỰC CHÍNH -->
    <div class="space-y-2.5 pt-1">
      <button type="button" 
              id="btn-verify" 
              onclick="AdminLoginController.submitCurrentMode()" 
              class="w-full py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black uppercase text-xs tracking-wider transition active:scale-95 shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
        <i class="fa-solid fa-lock-open"></i>
        <span id="btn-verify-text">Xác Thực Quyền Truy Cập</span>
      </button>

      <!-- Thông Báo Phản Hồi Trạng Thái -->
      <div id="status-message" class="text-xs min-h-[18px] transition-all duration-200"></div>
    </div>

  </div>
  <!-- BỘ NÃO JAVASCRIPT CONTROLLER ĐIỀU HÀNH XÁC THỰC CHUẨN HÓA -->
  <script>
    /**
     * =========================================================================
     * CONTROLLER: ADMIN LOGIN GATEWAY (v3.2 SAAS ENTERPRISE)
     * Tác giả: Đu Đủ - Cố vấn Chiến lược & Kỹ sư Trưởng hệ thống SaaS
     * Bản quyền: Bếp Thím 5 & LongHoaFood Master (Năm 2026)
     * Kiến trúc: Loại bỏ Premature Submit, Hỗ trợ Master Key dài, Đồng bộ Token
     * =========================================================================
     */
    var AdminLoginController = (function() {
      var currentMode = "PIN"; // "PIN" hoặc "SUPER"
      var currentPin = "";
      var isSubmitting = false;

      /**
       * CẬP NHẬT TRỰC QUAN CÁC CHẤM PIN TRÊN MÀN HÌNH
       */
      function updateDots() {
        for (var i = 0; i < 4; i++) {
          var dot = document.getElementById("pin-dot-" + i);
          if (!dot) continue;
          if (i < currentPin.length) {
            dot.className = "w-3.5 h-3.5 rounded-full bg-amber-400 border border-amber-300 shadow-sm shadow-amber-400/50 scale-110 transition-all duration-150";
          } else {
            dot.className = "w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-700 transition-all duration-150";
          }
        }
      }

      /**
       * NHẬP KÝ TỰ SỐ VÀO BIẾN ĐỆM
       * ĐÃ LOẠI BỎ HOÀN TOÀN LỖI TỰ ĐỘNG GỬI SỚM KHI CHẠM MỐC 4 KÝ TỰ
       */
      function pressDigit(d) {
        if (isSubmitting) return;
        showStatus("", "");

        // Cho phép nhập tối đa 20 ký tự (hỗ trợ cả mã PIN thông thường lẫn chuỗi ký tự dài)
        if (currentPin.length < 20) {
          currentPin += String(d);
          updateDots();
        }
      }

      /**
       * XÓA TOÀN BỘ MÃ ĐANG NHẬP
       */
      function clearAll() {
        if (isSubmitting) return;
        currentPin = "";
        updateDots();
        showStatus("", "");
      }

      /**
       * XÓA KÝ TỰ CUỐI CÙNG (BACKSPACE)
       */
      function backspace() {
        if (isSubmitting) return;
        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updateDots();
          showStatus("", "");
        }
      }

      /**
       * CHUYỂN ĐỔI CHẾ ĐỘ XÁC THỰC (PIN NHANH VS SUPER ADMIN 2FA)
       */
      function switchMode(mode) {
        currentMode = mode;
        var pinBox = document.getElementById("mode-pin-container");
        var superBox = document.getElementById("mode-super-container");
        var btnPin = document.getElementById("tab-btn-pin");
        var btnSuper = document.getElementById("tab-btn-super");
        var subTitle = document.getElementById("sub-title");

        clearAll();

        if (mode === "PIN") {
          if (pinBox) pinBox.classList.remove("hidden");
          if (superBox) superBox.classList.add("hidden");
          if (btnPin) btnPin.className = "flex-1 py-1.5 rounded-xl transition bg-amber-500 text-slate-950 shadow";
          if (btnSuper) btnSuper.className = "flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white";
          if (subTitle) subTitle.innerText = "Nhập mã PIN quyền hạn để tiếp tục:";
        } else {
          if (pinBox) pinBox.classList.add("hidden");
          if (superBox) superBox.classList.remove("hidden");
          if (btnSuper) btnSuper.className = "flex-1 py-1.5 rounded-xl transition bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 shadow font-black";
          if (btnPin) btnPin.className = "flex-1 py-1.5 rounded-xl transition text-slate-400 hover:text-white";
          if (subTitle) subTitle.innerText = "Xác thực 2 lớp dành riêng cho Super Admin:";
          var masterInput = document.getElementById("input-master-key");
          if (masterInput) masterInput.focus();
        }
      }

      /**
       * HIỂN THỊ THÔNG BÁO PHẢN HỒI TRẠNG THÁI
       */
      function showStatus(text, type) {
        var el = document.getElementById("status-message");
        if (!el) return;
        el.innerText = text;
        if (type === "success") {
          el.className = "text-xs font-bold text-emerald-400 animate-pulse";
        } else if (type === "error") {
          el.className = "text-xs font-bold text-rose-400";
          triggerShake();
        } else if (type === "loading") {
          el.className = "text-xs font-medium text-amber-400 flex items-center justify-center gap-1.5";
        } else {
          el.className = "text-xs text-slate-400";
        }
      }

      /**
       * HIỆU ỨNG RUNG LẮC KHI NHẬP SAI THÔNG TIN
       */
      function triggerShake() {
        var card = document.getElementById("login-card");
        if (card) {
          card.classList.remove("animate-shake");
          void card.offsetWidth; // Trigger reflow ép kích hoạt lại keyframe
          card.classList.add("animate-shake");
        }
      }

      /**
       * BỘ ĐIỀU PHỐI SUBMIT THEO CHẾ ĐỘ HIỆN HÀNH
       */
      function submitCurrentMode() {
        if (currentMode === "PIN") {
          submitPinAuth();
        } else {
          submitSuperTotpAuth();
        }
      }

      /**
       * XỬ LÝ XÁC THỰC MÃ PIN POS (1985 / 2026 / MASTER KEY)
       */
      async function submitPinAuth() {
        var cleanPin = currentPin.trim();

        if (!cleanPin) {
          showStatus("Vui lòng nhập mã PIN quyền hạn để tiếp tục!", "error");
          return;
        }

        isSubmitting = true;
        var btn = document.getElementById("btn-verify");
        var btnText = document.getElementById("btn-verify-text");
        if (btn) btn.disabled = true;
        if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang Xác Thực...';
        showStatus("Đang kiểm tra quyền hạn máy chủ...", "loading");

        try {
          if (!window.Thim5API || typeof window.Thim5API.callGAS !== "function") {
            throw new Error("Chưa kết nối module Thim5API adapter (kiểm tra lại file api.js)!");
          }

          var res = await Thim5API.callGAS("verifyAdminRole", {
            pin: cleanPin,
            passcode: cleanPin
          });

          if (res && res.status === "success" && res.data) {
            var role = res.data.role || "POS_STAFF";
            var token = res.data.authToken || "";

            // Lưu đồng bộ cả 2 định dạng khóa vào sessionStorage
            sessionStorage.setItem("thim5_auth_role", role);
            sessionStorage.setItem("thim5_admin_token", token);
            sessionStorage.setItem("THIM5_AUTH_TOKEN", token);
            sessionStorage.setItem("THIM5_ADMIN_ROLE", role);
            sessionStorage.setItem("THIM5_ROLE_TITLE", res.data.roleTitle || "");

            showStatus("🎉 " + (res.data.message || "Xác thực thành công!") + " Đang vào hệ thống...", "success");

            setTimeout(function() {
              window.location.replace("admin-shell.html");
            }, 350);

          } else {
            var errMsg = (res && res.message) ? res.message : "Mã PIN quyền hạn không chính xác!";
            showStatus("❌ " + errMsg, "error");
            clearAll();
          }
        } catch (err) {
          console.error("Lỗi xác thực mã PIN:", err);
          showStatus("❌ Lỗi kết nối: " + err.message, "error");
          clearAll();
        } finally {
          isSubmitting = false;
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = "Xác Thực Quyền Truy Cập";
        }
      }

      /**
       * XỬ LÝ XÁC THỰC SUPER ADMIN 2FA (MASTER KEY + TOTP)
       */
      async function submitSuperTotpAuth() {
        var masterKeyInput = document.getElementById("input-master-key");
        var totpCodeInput = document.getElementById("input-totp-code");

        var masterKey = masterKeyInput ? masterKeyInput.value.trim() : "";
        var totpCode = totpCodeInput ? totpCodeInput.value.trim().replace(/\s/g, '') : "";

        if (!masterKey || !totpCode) {
          showStatus("Vui lòng nhập đầy đủ Master Key và Mã TOTP 6 số!", "error");
          return;
        }

        isSubmitting = true;
        var btn = document.getElementById("btn-verify");
        var btnText = document.getElementById("btn-verify-text");
        if (btn) btn.disabled = true;
        if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang Kiểm Toán 2FA...';
        showStatus("Đang kiểm tra bảo mật Google Authenticator...", "loading");

        try {
          if (!window.Thim5API || typeof window.Thim5API.callGAS !== "function") {
            throw new Error("Chưa kết nối module Thim5API adapter!");
          }

          var res = await Thim5API.callGAS("verifySuperAdminTotp", {
            masterKey: masterKey,
            totpCode: totpCode
          });

          if (res && res.status === "success" && res.data) {
            var sessionToken = res.data.sessionToken || "";

            // Lưu phiên Super Admin toàn cục
            sessionStorage.setItem("thim5_auth_role", "SUPER_ADMIN");
            sessionStorage.setItem("thim5_master_key", masterKey);
            sessionStorage.setItem("thim5_admin_token", sessionToken);
            sessionStorage.setItem("THIM5_AUTH_TOKEN", sessionToken);
            sessionStorage.setItem("THIM5_ADMIN_ROLE", "SUPER_ADMIN");

            showStatus("🎉 Xác thực 2FA thành công! Đang chuyển hướng...", "success");

            setTimeout(function() {
              window.location.replace("admin-shell.html");
            }, 350);

          } else {
            var errMsg = (res && res.message) ? res.message : "Xác thực 2FA thất bại!";
            showStatus("❌ " + errMsg, "error");
          }
        } catch (err) {
          console.error("Lỗi xác thực 2FA:", err);
          showStatus("❌ Lỗi kết nối 2FA: " + err.message, "error");
        } finally {
          isSubmitting = false;
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = "Xác Thực Quyền Truy Cập";
        }
      }

      /**
       * GỬI MÃ OTP CỨU HỘ KHẨN CẤP VỀ GMAIL SUPER ADMIN
       */
      async function requestEmergencyOtp() {
        var masterKeyInput = document.getElementById("input-master-key");
        var masterKey = masterKeyInput ? masterKeyInput.value.trim() : "";

        if (!masterKey) {
          masterKey = prompt("Vui lòng nhập Master Key để gửi mã khẩn cấp về Gmail haiau2205@gmail.com:");
        }
        if (!masterKey) return;

        showStatus("Đang gửi mã giải cứu về Gmail...", "loading");
        try {
          if (!window.Thim5API || typeof window.Thim5API.callGAS !== "function") {
            throw new Error("Chưa kết nối Thim5API!");
          }

          var res = await Thim5API.callGAS("sendEmergencyBackupOtpToEmail", { 
            masterKey: masterKey.trim() 
          });

          if (res && res.status === "success") {
            alert("📬 " + (res.data ? res.data.message : "Đã gửi mã giải cứu khẩn cấp qua Gmail!"));
            if (masterKeyInput) masterKeyInput.value = masterKey.trim();
            var totpInput = document.getElementById("input-totp-code");
            if (totpInput) totpInput.focus();
            showStatus("Đã gửi mã giải cứu thành công.", "success");
          } else {
            showStatus("⛔ " + (res.message || "Không thể gửi mã cứu hộ!"), "error");
          }
        } catch (e) {
          showStatus("Lỗi gửi mail: " + e.message, "error");
        }
      }

      /**
       * HỖ TRỢ NHẬP LIỆU TỪ BÀN PHÍM VẬT LÝ MÁY TÍNH
       */
      window.addEventListener("keydown", function(e) {
        if (currentMode !== "PIN") {
          if (e.key === "Enter") submitCurrentMode();
          return;
        }

        if (e.key >= "0" && e.key <= "9") {
          pressDigit(e.key);
        } else if (e.key === "Backspace") {
          backspace();
        } else if (e.key === "Escape") {
          clearAll();
        } else if (e.key === "Enter") {
          submitCurrentMode();
        }
      });

      /**
       * TỰ ĐỘNG CHUYỂN TRANG NẾU PHIÊN ĐĂNG NHẬP TRƯỚC ĐÓ VẪN CÒN HIỆU LỰC
       */
      window.addEventListener("DOMContentLoaded", function() {
        var savedRole = sessionStorage.getItem("thim5_auth_role") || sessionStorage.getItem("THIM5_ADMIN_ROLE");
        if (savedRole) {
          window.location.replace("admin-shell.html");
        }
      });

      // Public API ra ngoài phạm vi điều khiển
      return {
        pressDigit: pressDigit,
        clearAll: clearAll,
        backspace: backspace,
        switchMode: switchMode,
        submitCurrentMode: submitCurrentMode,
        requestEmergencyOtp: requestEmergencyOtp
      };
    })();
  </script>
</body>
</html>
